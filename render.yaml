# Render Blueprint: one-click Merge0 — the server + a managed Postgres.
# Deploy button: https://render.com/deploy?repo=https://github.com/hkd987/Merge0
#
# Tokens are generated for you; the values you're prompted for (sync: false)
# are your own credentials — they live in Render's env store, never in this
# file (CLAUDE.md invariant: secrets by env-var name only). Full deploy
# notes: docs/one-click-deploy.md.

databases:
  - name: merge0-db
    plan: free
    databaseName: merge0
    user: merge0

services:
  - type: web
    name: merge0
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MERGE0_DATABASE_URL
        fromDatabase:
          name: merge0-db
          property: connectionString
      # Render routes traffic to the port in PORT (10000).
      - key: MERGE0_BIND
        value: 0.0.0.0:10000
      - key: MERGE0_API_TOKEN
        generateValue: true
      - key: MERGE0_RUNNER_TOKEN
        generateValue: true
      - key: MERGE0_GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: MERGE0_REPO
        sync: false # your product repo, owner/name
      - key: MERGE0_GITHUB_APP_ID
        sync: false # docs/github-app-setup.md walks through creating the App
      - key: MERGE0_GITHUB_INSTALLATION_ID
        sync: false
      - key: MERGE0_GITHUB_APP_PRIVATE_KEY
        sync: false # paste the PEM contents
      - key: ANTHROPIC_API_KEY
        sync: false # the triage gate runs on YOUR key
      # After the first deploy, set this to the service's public URL
      # (Settings → your onrender.com URL) so Slack links and runner
      # callbacks resolve.
      - key: MERGE0_PUBLIC_URL
        sync: false
