# Scout: the insights-agnostic payoff — the same defect visible in ≥2 sources.
# query_template is EXECUTED as a deterministic Signal filter — grammar
# documented in new-exception-clusters.toml; typos fail the triage run loudly.

name = "cross-source-correlation"
description = "Same fingerprint/join_keys appearing in two or more sources?"
schedule = "nightly"
sources = ["posthog", "sentry"]
query_template = "join_keys.stack_hash IS NOT NULL OR join_keys.url_path IS NOT NULL"
prompt = """
Find groups of Signals from different sources that describe the same
underlying problem: matching join_keys.stack_hash (same exception type),
matching join_keys.url_path with overlapping time windows, or matching
join_keys.account_id around the same timestamps. A defect corroborated by
multiple independent sources is a stronger candidate than any single-source
signal — merge each group into one candidate finding with combined evidence.
"""
