# Fetch-layer sources (PRD §1): which vendors the poll loop talks to and
# how. Versioned here so enabling a source or retuning its settings is an
# ordinary reviewed PR (meta-loop, §5d).
#
# Secrets are env-var NAMES only (`*_env` fields) — the values live in the
# deployment environment and are resolved at startup; a missing variable
# fails loudly, naming the variable. Never put a credential value in this
# file. All sections ship disabled with example.com-style placeholders;
# enable per deployment.

[posthog]
enabled = false
# PostHog project id (the numeric path segment of the API routes).
project_id = "12345"
# Env var holding a personal API key with error-tracking + events read.
api_key_env = "MERGE0_POSTHOG_API_KEY"
# API host; EU cloud deployments use https://eu.posthog.com.
base_url = "https://us.posthog.com"
# Project UI base used for deep links (issue pages, session replays).
project_base_url = "https://us.posthog.com/project/12345"

[sentry]
enabled = false
organization = "example-org"
project = "example-app"
# Env var holding an auth token with event:read on the project.
auth_token_env = "MERGE0_SENTRY_AUTH_TOKEN"
# Self-hosted Sentry deployments override this.
base_url = "https://sentry.io"

[zendesk]
enabled = false
# {subdomain}.zendesk.com — the API base is derived from it.
subdomain = "example"
# Env vars holding the agent email the API token belongs to, and the token.
email_env = "MERGE0_ZENDESK_EMAIL"
api_token_env = "MERGE0_ZENDESK_API_TOKEN"
# Agent-workspace base used for ticket deep links.
agent_base_url = "https://example.zendesk.com/agent"

[datadog]
enabled = false
# Env vars holding the API key (DD-API-KEY) and application key
# (DD-APPLICATION-KEY).
api_key_env = "MERGE0_DATADOG_API_KEY"
app_key_env = "MERGE0_DATADOG_APP_KEY"
# EU deployments use https://api.datadoghq.eu.
base_url = "https://api.datadoghq.com"
# Datadog app base used for event-explorer deep links.
app_base_url = "https://app.datadoghq.com"

[github_issues]
enabled = false
# owner/name. Auth rides on the Merge0 GitHub App installation — no
# separate secret here.
repo = "example-org/example-app"
