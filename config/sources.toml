# Fetch-layer sources (PRD §1): which vendors the poll loop talks to and
# how. Versioned here so enabling a source or retuning its settings is an
# ordinary reviewed PR (meta-loop, §5d).
#
# Secrets are env-var NAMES only (`*_env` fields) — the values live in the
# deployment environment and are resolved at startup; a missing variable
# fails loudly, naming the variable. Never put a credential value in this
# file. All sections ship disabled with example.com-style placeholders;
# enable per deployment.

[posthog]
enabled = false
# PostHog project id (the numeric path segment of the API routes).
project_id = "12345"
# Env var holding a personal API key with error-tracking + events read.
api_key_env = "MERGE0_POSTHOG_API_KEY"
# API host; EU cloud deployments use https://eu.posthog.com.
base_url = "https://us.posthog.com"
# Project UI base used for deep links (issue pages, session replays).
project_base_url = "https://us.posthog.com/project/12345"

[sentry]
enabled = false
organization = "example-org"
project = "example-app"
# Env var holding an auth token with event:read on the project.
auth_token_env = "MERGE0_SENTRY_AUTH_TOKEN"
# Self-hosted Sentry deployments override this.
base_url = "https://sentry.io"

[zendesk]
enabled = false
# {subdomain}.zendesk.com — the API base is derived from it.
subdomain = "example"
# Env vars holding the agent email the API token belongs to, and the token.
email_env = "MERGE0_ZENDESK_EMAIL"
api_token_env = "MERGE0_ZENDESK_API_TOKEN"
# Agent-workspace base used for ticket deep links.
agent_base_url = "https://example.zendesk.com/agent"

[datadog]
enabled = false
# Env vars holding the API key (DD-API-KEY) and application key
# (DD-APPLICATION-KEY).
api_key_env = "MERGE0_DATADOG_API_KEY"
app_key_env = "MERGE0_DATADOG_APP_KEY"
# EU deployments use https://api.datadoghq.eu.
base_url = "https://api.datadoghq.com"
# Datadog app base used for event-explorer deep links.
app_base_url = "https://app.datadoghq.com"

[github_issues]
enabled = false
# owner/name. Auth rides on the Merge0 GitHub App installation — no
# separate secret here.
repo = "example-org/example-app"

# ---- Ticket + planning sources (schema v0.3) ----

[jira]
enabled = false
# Jira Cloud site base; browse links derive from it ({base_url}/browse/KEY).
base_url = "https://acme-example.atlassian.net"
# Jira Cloud API auth is basic auth: account email + API token.
email_env = "MERGE0_JIRA_EMAIL"
api_token_env = "MERGE0_JIRA_API_TOKEN"
# JQL the poller runs (the fetch cursor ANDs an `updated >=` bound onto it).
jql = "statusCategory != Done ORDER BY updated ASC"

[linear]
enabled = false
# Env var holding a Linear API key (read access).
api_key_env = "MERGE0_LINEAR_API_KEY"
base_url = "https://api.linear.app"

[slack_channels]
enabled = false
# Bot token with channels:history + channels:read scopes for the channels
# below. This is the INGEST side (reading #bugs-style channels) — separate
# from the notification webhook (MERGE0_SLACK_WEBHOOK_URL).
bot_token_env = "MERGE0_SLACK_BOT_TOKEN"
base_url = "https://slack.com/api"
# Workspace base for archive permalinks in evidence links.
team_base_url = "https://acme-example.slack.com"
# Channels whose messages are treated as tickets by team convention.
channels = [{ id = "C0123456789", name = "bugs" }]

[asana]
enabled = false
# Env var holding a personal access token.
pat_env = "MERGE0_ASANA_PAT"
base_url = "https://app.asana.com/api/1.0"
# Projects whose tasks are polled.
project_gids = ["120000000000001"]

[trello]
enabled = false
key_env = "MERGE0_TRELLO_API_KEY"
token_env = "MERGE0_TRELLO_TOKEN"
base_url = "https://api.trello.com/1"
# Boards whose open cards are polled.
board_ids = ["abc123def456"]

[intercom]
enabled = false
access_token_env = "MERGE0_INTERCOM_ACCESS_TOKEN"
base_url = "https://api.intercom.io"
# Inbox base for conversation deep links.
app_base_url = "https://app.intercom-example.com/a/inbox/abc123"
