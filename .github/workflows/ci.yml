name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  MERGE0_TEST_DATABASE_URL: postgres://merge0:merge0@localhost:5432/merge0

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: merge0
          POSTGRES_PASSWORD: merge0
          POSTGRES_DB: merge0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merge0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI tests + build (embedded into the server by rust-embed)
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Dependency advisories + license compliance (security review gap, closed
  # in the open-sourcing pass). Policy lives in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: stable
          command: check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t merge0-server:${{ github.sha }} .
