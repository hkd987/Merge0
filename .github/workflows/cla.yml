# CLA enforcement: a PR from an unsigned contributor gets a comment asking
# for the signature phrase and a failing check until it is posted.
# Signatures are recorded on the `cla-signatures` branch of THIS repo —
# no external service, nothing to keep alive.
#
# SECURITY: this workflow runs on `pull_request_target`, which executes in
# the base repo's context with write permissions. That is safe precisely
# because it NEVER checks out or executes PR code — the job is a fixed,
# pinned action operating on PR metadata only. Do not add an
# `actions/checkout` of the PR head or any build/test step here; that is
# the classic pwn-request vulnerability. (See docs/security-review.md for
# the repo's threat-model conventions.)

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # PRs OPENED by the repo owner skip enforcement entirely (the step is
      # skipped, so the job — and the `cla` check — still reports success).
      # Rationale: the owner signing their own CLA is meaningless, and the
      # owner's agent-session commits carry an account-less git author
      # ("Claude") that can neither sign nor be allowlisted — contributor-
      # assistant matches allowlist entries against GitHub LOGINS, so
      # unlinked author names never match. Keying on the PR author is safe
      # where keying on forgeable commit-author emails would not be: the
      # opening account is authenticated by GitHub. External PRs get full
      # enforcement regardless of what identities their commits carry.
      - name: CLA assistant
        if: >
          (github.event_name == 'pull_request_target' &&
           github.event.pull_request.user.login != 'hkd987') ||
          (github.event_name == 'issue_comment' &&
           (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') &&
           github.event.issue.user.login != 'hkd987')
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'hkd987,dependabot[bot],github-actions[bot],*[bot]'
          custom-notsigned-prcomment: >
            Thanks for the contribution! Before we can merge, we need you to
            sign the [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            — Merge0 is open-core, and the CLA is what lets contributed code
            live on both sides of that boundary. Signing is one comment on
            this PR, quoted below.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA ✍️'
          lock-pullrequest-aftermerge: false
