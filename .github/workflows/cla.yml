# CLA enforcement: a PR from an unsigned contributor gets a comment asking
# for the signature phrase and a failing check until it is posted.
# Signatures are recorded on the `cla-signatures` branch of THIS repo —
# no external service, nothing to keep alive.
#
# SECURITY: this workflow runs on `pull_request_target`, which executes in
# the base repo's context with write permissions. That is safe precisely
# because it NEVER checks out or executes PR code — the job is a fixed,
# pinned action operating on PR metadata only. Do not add an
# `actions/checkout` of the PR head or any build/test step here; that is
# the classic pwn-request vulnerability. (See docs/security-review.md for
# the repo's threat-model conventions.)

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA.md'
          branch: 'cla-signatures'
          # The repo owner is allowlisted: an owner signing their own CLA is
          # meaningless, and a required cla check must not block owner PRs.
          allowlist: 'hkd987,dependabot[bot],github-actions[bot],*[bot]'
          custom-notsigned-prcomment: >
            Thanks for the contribution! Before we can merge, we need you to
            sign the [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            — Merge0 is open-core, and the CLA is what lets contributed code
            live on both sides of that boundary. Signing is one comment on
            this PR, quoted below.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA ✍️'
          lock-pullrequest-aftermerge: false
